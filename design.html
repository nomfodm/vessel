<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --cyan: #25c3e8;
  --purple: #5625e8;
  --indigo: #272bf2;
  --bg-deep: #05050e;
  --glass: rgba(255,255,255,0.045);
  --glass-border: rgba(255,255,255,0.09);
  --glass-hover: rgba(255,255,255,0.07);
  --text: #eeeeff;
  --text-dim: rgba(238,238,255,0.5);
  --text-faint: rgba(238,238,255,0.22);
  --grad: linear-gradient(135deg, #25c3e8, #5625e8);
  --grad-text: linear-gradient(90deg, #25c3e8, #a78bfa, #5625e8);
  --glow-c: rgba(37,195,232,0.35);
  --glow-p: rgba(86,37,232,0.35);
  --r: 14px;
  --r-sm: 10px;
  --font: 'Nunito', sans-serif;
}

html, body {
  width: 100%; height: 100%;
  background: #e8e8f0;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font);
  overflow: hidden;
}

/* ── CANVAS BG (inside window) ── */
#stars-canvas {
  position: absolute; inset: 0; z-index: 0; pointer-events: none;
  border-radius: 18px;
}

/* ── WINDOW ── */
.window {
  width: 960px; height: 600px;
  position: relative; z-index: 1;
  border-radius: 18px;
  overflow: hidden;
  box-shadow:
    0 0 0 1px rgba(0,0,0,0.15),
    0 20px 60px rgba(0,0,0,0.25);
  background: rgba(6,6,18,0.92);
  backdrop-filter: blur(40px) saturate(140%);
}

/* ── TITLEBAR ── */
.titlebar {
  height: 36px;
  background: rgba(255,255,255,0.025);
  border-bottom: 1px solid var(--glass-border);
  display: flex; align-items: center;
  padding: 0 16px;
  gap: 8px;
  position: relative;
  user-select: none;
}
.traffic-lights { display: flex; gap: 7px; align-items: center; }
.dot { width: 12px; height: 12px; border-radius: 50%; cursor: pointer; transition: filter .15s; }
.dot:hover { filter: brightness(1.25); }
.dot-r { background: #ff5f57; box-shadow: 0 0 6px rgba(255,95,87,0.5); }
.dot-y { background: #febc2e; box-shadow: 0 0 6px rgba(254,188,46,0.4); }
.dot-g { background: #28c840; box-shadow: 0 0 6px rgba(40,200,64,0.4); }
.titlebar-title {
  position: absolute; left: 50%; transform: translateX(-50%);
  font-size: 12px; font-weight: 700; color: var(--text-faint);
  letter-spacing: 0.4px; pointer-events: none; white-space: nowrap;
}

/* ── TOP NAV ── */
.topnav {
  height: 52px;
  background: rgba(255,255,255,0.025);
  border-bottom: 1px solid var(--glass-border);
  display: flex; align-items: center;
  padding: 0 24px;
  gap: 6px;
}
.nav-logo { display: flex; align-items: center; gap: 10px; margin-right: 20px; }
.nav-logo-text {
  font-size: 16px; font-weight: 900; letter-spacing: -0.3px;
  background: var(--grad-text);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.nav-divider { width: 1px; height: 20px; background: var(--glass-border); margin: 0 4px; }
.nav-tab {
  height: 34px; padding: 0 16px;
  border-radius: 9px; border: none;
  background: transparent;
  color: var(--text-dim);
  font-family: var(--font); font-size: 13px; font-weight: 700;
  cursor: pointer; transition: all .18s;
  display: flex; align-items: center; gap: 7px;
  position: relative;
  white-space: nowrap;
}
.nav-tab:hover { background: var(--glass-hover); color: var(--text); }
.nav-tab.active {
  background: rgba(37,195,232,0.1);
  color: var(--cyan);
}
.nav-tab.active::after {
  content: '';
  position: absolute; bottom: -9px; left: 50%; transform: translateX(-50%);
  width: 20px; height: 2px; border-radius: 1px;
  background: var(--cyan);
  box-shadow: 0 0 8px var(--glow-c);
}
.nav-tab svg { width: 15px; height: 15px; }
.nav-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.nav-user {
  display: flex; align-items: center; gap: 9px;
  padding: 5px 12px 5px 6px;
  background: var(--glass); border: 1px solid var(--glass-border);
  border-radius: 22px; cursor: pointer; transition: all .18s;
}
.nav-user:hover { background: var(--glass-hover); border-color: rgba(37,195,232,0.25); }
.nav-avatar {
  width: 26px; height: 26px; border-radius: 50%;
  background: var(--grad);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 900; color: #fff;
  flex-shrink: 0;
}
.nav-username { font-size: 13px; font-weight: 700; color: var(--text); }

/* ── CONTENT ── */
.content {
  height: calc(600px - 36px - 52px);
  overflow-y: auto; overflow-x: hidden;
  position: relative;
}
.content::-webkit-scrollbar { width: 4px; }
.content::-webkit-scrollbar-track { background: transparent; }
.content::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

/* ── PAGE ANIM ── */
@keyframes page-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
.page { animation: page-in .28s cubic-bezier(.16,1,.3,1) both; }

/* ── GLASS CARD ── */
.glass-card {
  background: var(--glass);
  border: 1px solid var(--glass-border);
  border-radius: var(--r);
  backdrop-filter: blur(20px);
  transition: all .22s;
}
.glass-card:hover {
  background: var(--glass-hover);
  border-color: rgba(37,195,232,0.2);
  box-shadow: 0 8px 32px rgba(0,0,0,0.35);
}

/* ── BUTTONS ── */
.btn-primary {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--grad); color: #fff; border: none;
  border-radius: var(--r-sm); padding: 0 28px; height: 42px;
  font-family: var(--font); font-weight: 800; font-size: 14px;
  cursor: pointer; transition: all .2s; position: relative; overflow: hidden;
  box-shadow: 0 4px 20px var(--glow-p);
}
.btn-primary::after { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg,rgba(255,255,255,0.12),transparent); pointer-events: none; }
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 32px var(--glow-p), 0 0 20px var(--glow-c); }
.btn-primary:active { transform: scale(.97); }
.btn-primary:disabled { opacity: .45; cursor: not-allowed; transform: none; }

.btn-danger {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  background: rgba(220,38,38,0.15); color: #fca5a5;
  border: 1px solid rgba(220,38,38,0.3);
  border-radius: var(--r-sm); padding: 0 22px; height: 42px;
  font-family: var(--font); font-weight: 800; font-size: 14px;
  cursor: pointer; transition: all .2s;
}
.btn-danger:hover { background: rgba(220,38,38,0.25); }

.btn-ghost {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--glass); color: var(--text-dim);
  border: 1px solid var(--glass-border);
  border-radius: var(--r-sm); padding: 0 20px; height: 38px;
  font-family: var(--font); font-weight: 700; font-size: 13px;
  cursor: pointer; transition: all .18s;
}
.btn-ghost:hover { background: var(--glass-hover); color: var(--text); border-color: rgba(255,255,255,0.18); }

.btn-icon-sq {
  width: 38px; height: 38px; border-radius: 9px;
  background: var(--glass); border: 1px solid var(--glass-border);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all .18s; color: var(--text-dim);
  flex-shrink: 0;
}
.btn-icon-sq:hover { background: var(--glass-hover); color: var(--cyan); border-color: rgba(37,195,232,0.3); }
.btn-icon-sq.active { background: rgba(37,195,232,0.12); color: var(--cyan); border-color: rgba(37,195,232,0.35); }
.btn-icon-sq svg { width: 17px; height: 17px; }

/* ── INPUTS ── */
.input-wrap { display: flex; flex-direction: column; gap: 6px; }
.input-label { font-size: 11px; font-weight: 800; color: var(--text-faint); text-transform: uppercase; letter-spacing: .6px; }
.input-field {
  height: 42px; padding: 0 14px;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--glass-border);
  border-radius: var(--r-sm);
  color: var(--text); font-family: var(--font); font-size: 14px; font-weight: 600;
  outline: none; transition: border .2s, box-shadow .2s;
}
.input-field:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(37,195,232,0.12); }
.input-field::placeholder { color: var(--text-faint); font-weight: 500; }

/* ── BADGE ── */
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11px; font-weight: 800; padding: 3px 9px;
  border-radius: 6px; font-family: var(--font);
}
.badge-online { background: rgba(34,197,94,0.15); color: #4ade80; border: 1px solid rgba(34,197,94,0.25); }
.badge-offline { background: rgba(239,68,68,0.12); color: #f87171; border: 1px solid rgba(239,68,68,0.2); }
.badge-pinging { background: rgba(251,191,36,0.12); color: #fcd34d; border: 1px solid rgba(251,191,36,0.2); }
.badge-version { background: rgba(167,139,250,0.12); color: #a78bfa; border: 1px solid rgba(167,139,250,0.2); }

@keyframes pulse-dot { 0%,100%{opacity:.4}50%{opacity:1} }
.dot-pulse { width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse-dot 1.4s ease-in-out infinite; }

/* ── TOGGLE ── */
.toggle-wrap {
  width: 40px; height: 22px; border-radius: 11px;
  cursor: pointer; position: relative;
  transition: background .2s; flex-shrink: 0; border: none;
}
.toggle-wrap.on { background: linear-gradient(135deg,#25c3e8,#5625e8); box-shadow: 0 2px 10px var(--glow-p); }
.toggle-wrap.off { background: rgba(255,255,255,0.1); }
.toggle-knob {
  position: absolute; top: 3px;
  width: 16px; height: 16px; border-radius: 50%;
  background: #fff; transition: left .2s;
  box-shadow: 0 1px 4px rgba(0,0,0,0.4);
}
.toggle-wrap.on .toggle-knob { left: 21px; }
.toggle-wrap.off .toggle-knob { left: 3px; }

/* ── PROGRESS ── */
@keyframes shine { 0%{background-position:-200% 0}100%{background-position:200% 0} }
.prog-track { height: 5px; border-radius: 3px; background: rgba(255,255,255,0.08); overflow: hidden; }
.prog-fill {
  height: 100%; border-radius: 3px;
  background: linear-gradient(90deg, var(--cyan), var(--purple), var(--cyan));
  background-size: 200% 100%;
  animation: shine 1.6s linear infinite;
  transition: width .25s ease;
}

/* ── SPINNER ── */
@keyframes spin { to{transform:rotate(360deg)} }
.spinner { width:14px;height:14px;border-radius:50%;border:2px solid rgba(37,195,232,0.2);border-top-color:var(--cyan);animation:spin .7s linear infinite;flex-shrink:0; }

/* ── SLIDER ── */
input[type=range] {
  -webkit-appearance:none; width:100%; height:4px;
  border-radius:2px; background: rgba(255,255,255,0.1);
  outline:none; cursor:pointer;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance:none; width:16px;height:16px;border-radius:50%;
  background:#fff; box-shadow:0 0 0 2px var(--cyan), 0 2px 8px rgba(0,0,0,0.4);
  cursor:grab; transition:transform .15s;
}
input[type=range]::-webkit-slider-thumb:active { transform:scale(1.25); cursor:grabbing; }

/* ── GRAD TEXT ── */
.grad { background:var(--grad-text);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text; }
@keyframes grad-shift { 0%{background-position:0%}100%{background-position:200%} }

/* ── SCREEN TRANSITIONS ── */
@keyframes slide-fade { from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none} }
.sub-enter { animation: slide-fade .22s ease both; }

/* misc */
@keyframes float { 0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)} }
</style>
</head>

const GS = { IDLE:'idle', FETCHING:'fetching', DL:'dl', PREP:'prep', PLAYING:'playing' };

function DetailPage({ profile, onBack }) {
  const [sub, setSub] = useState('main'); // main | settings | optfiles
  const [gs, setGs] = useState(GS.IDLE);
  const [prog, setProg] = useState({done:0,total:100});
  const [ram, setRam] = useState(4096);
  const [path] = useState('C:\\Users\\Player\\AppData\\Roaming\\.infinity\\' + profile.slug);
  const [optFiles, setOptFiles] = useState(OPT_FILES);
  const timerRef = useRef(null);
  const TOTAL_RAM = 16384;

  function startPlay() {
    setGs(GS.FETCHING);
    setTimeout(()=>{
      setGs(GS.DL); setProg({done:0,total:312});
      timerRef.current = setInterval(()=>{
        setProg(p=>{
          const next = Math.min(p.done + Math.floor(Math.random()*15)+5, p.total);
          if(next >= p.total){
            clearInterval(timerRef.current);
            setGs(GS.PREP);
            setTimeout(()=>setGs(GS.PLAYING),1100);
            return {...p,done:p.total};
          }
          return {...p,done:next};
        });
      },140);
    },800);
  }

  function cancel() {
    clearInterval(timerRef.current);
    setGs(GS.IDLE); setProg({done:0,total:100});
  }

  useEffect(()=>()=>clearInterval(timerRef.current),[]);

  const isIdle = gs===GS.IDLE;
  const isLoading = [GS.FETCHING,GS.DL,GS.PREP].includes(gs);
  const isPlaying = gs===GS.PLAYING;

  const statusMsg = {
    [GS.FETCHING]:'Получаю файлы игры...',
    [GS.DL]:`Загрузка ${prog.done} / ${prog.total} МБ`,
    [GS.PREP]:'Подготовка к запуску...',
    [GS.PLAYING]:'Игра запущена',
    [GS.IDLE]:'',

  return (
    <div className="page" style={{padding:'24px 28px', height:'100%', display:'flex', flexDirection:'column'}}>

              <span style={{color:'var(--cyan)',fontSize:13,fontWeight:700}}>
                {sub==='settings'?'Настройки':'Опциональные файлы'}

          : <span style={{color:'var(--cyan)',fontSize:13,fontWeight:700}}>{profile.title}</span>

                <span style={{fontSize:10,color:'var(--text-faint)',fontWeight:700}}>{TOTAL_RAM} МБ</span>
              </div>

          </div>

          <div>
            <div style={{fontSize:12,color:'var(--text-faint)',fontWeight:800,textTransform:'uppercase',letterSpacing:.6,marginBottom:8}}>Папка с файлами игры</div>
            <div style={{
              fontSize:13,color:'var(--text-dim)',fontWeight:600,

/* ═══════════════ INFO PAGE ═══════════════ */
const US = { CHECK:'check', NONE:'none', FOUND:'found', UPDATING:'updating', RESTART:'restart', ERROR:'error' };

function InfoPage() {
  const [us, setUs] = useState(US.CHECK);
  const VERSION = 'v2.1.0';

  useEffect(()=>{
    const t = setTimeout(()=>setUs(US.FOUND), 1300);
    return ()=>clearTimeout(t);
  },[]);

  function doUpdate() {
    setUs(US.UPDATING);
    setTimeout(()=>{
      setUs(US.RESTART);
      setTimeout(()=>setUs(US.NONE),1500);
    },2200);
  }

  function cycle() {
    const all = Object.values(US);
    setUs(all[(all.indexOf(us)+1)%all.length]);
  }

  const statusUI = {
    [US.CHECK]: <div style={{display:'flex',alignItems:'center',gap:8}}><div className="spinner"/><span style={{fontSize:13,color:'var(--text-dim)',fontWeight:600}}>Проверка обновлений...</span></div>,
    [US.NONE]: <div style={{display:'flex',alignItems:'center',gap:8}}><I.Check/><span style={{fontSize:13,color:'#4ade80',fontWeight:700}}>Обновлений не найдено</span></div>,
    [US.FOUND]: <div style={{display:'flex',flexDirection:'column',gap:6}}>
      <div style={{display:'flex',alignItems:'center',gap:8}}><I.Warn/><span style={{fontSize:13,color:'#fbbf24',fontWeight:700}}>Найдены необязательные обновления</span></div>
      <button onClick={doUpdate} style={{background:'none',border:'none',cursor:'pointer',color:'var(--cyan)',fontSize:13,fontWeight:700,padding:0,textAlign:'left',textDecoration:'underline'}}>Обновиться</button>
    </div>,
    [US.UPDATING]: <div style={{display:'flex',alignItems:'center',gap:8}}><div className="spinner"/><span style={{fontSize:13,color:'var(--text-dim)',fontWeight:600}}>Обновление...</span></div>,
    [US.RESTART]: <div style={{display:'flex',alignItems:'center',gap:8}}><div className="spinner"/><span style={{fontSize:13,color:'var(--text-dim)',fontWeight:600}}>Перезапуск...</span></div>,
    [US.ERROR]: <div style={{display:'flex',alignItems:'center',gap:8}}><I.Err/><span style={{fontSize:13,color:'#f87171',fontWeight:700}}>Ошибка при обновлении</span></div>,
  }[us];

  return (
    <div className="page" style={{padding:'28px 28px'}}>
      <div style={{fontSize:14,color:'var(--text-faint)',fontWeight:700,marginBottom:24,textTransform:'uppercase',letterSpacing:.5}}>О программе</div>

      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:24,minWidth:0}}>
        <div style={{flex:1,minWidth:0,overflow:'hidden'}}>
          <div style={{display:'flex',alignItems:'baseline',gap:10,marginBottom:16,whiteSpace:'nowrap',overflow:'hidden'}}>
            <span style={{fontSize:20,fontWeight:900,letterSpacing:-0.3,color:'var(--text)',whiteSpace:'nowrap',flexShrink:0}}>Infinity <span style={{background:'linear-gradient(90deg,#25c3e8,#a78bfa,#5625e8)',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent',backgroundClip:'text'}}>Launcher</span></span>
            <span style={{fontSize:13,fontWeight:700,color:'var(--text-faint)',flexShrink:0,whiteSpace:'nowrap'}}>{VERSION}</span>
          </div>
          {statusUI}

          <div style={{marginTop:32,display:'flex',flexDirection:'column',gap:10}}>
            {[
              ['Движок','Wails v2 + React 18'],
              ['Платформы','Windows · macOS · Linux'],
              ['Протокол','Minecraft Auth v3'],
            ].map(([k,v])=>(
              <div key={k} style={{display:'flex',gap:0,alignItems:'baseline',whiteSpace:'nowrap'}}>
                <span style={{fontSize:13,color:'var(--text-faint)',fontWeight:600,flexShrink:0,width:110}}>{k}</span>
                <span style={{fontSize:13,color:'var(--text)',fontWeight:700,whiteSpace:'nowrap'}}>{v}</span>
              </div>
            ))}
          </div>

          <button onClick={cycle} style={{
            marginTop:28,fontSize:11,color:'var(--text-faint)',
            background:'rgba(255,255,255,0.04)',
            border:'1px solid var(--glass-border)',
            borderRadius:7,padding:'5px 12px',cursor:'pointer',fontFamily:'var(--font)',fontWeight:600,
          }}>
            [демо] следующий статус →
          </button>
        </div>

        <div style={{display:'flex',alignItems:'center',justifyContent:'center',paddingTop:4}}>
          <div style={{animation:'float 4s ease-in-out infinite'}}>
            <Logo size={96}/>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ═══════════════ TOP NAV ═══════════════ */
function TopNav({ tab, setTab, user, onLogout }) {
  return (
    <div className="topnav">
      <div className="nav-logo">
        <Logo size={26}/>
        <span className="nav-logo-text">Infinity</span>
      </div>
      <div className="nav-divider"/>
      <button className={`nav-tab ${tab==='play'?'active':''}`} onClick={()=>setTab('play')}>
        <I.Play/> Играть
      </button>
      <button className={`nav-tab ${tab==='info'?'active':''}`} onClick={()=>setTab('info')}>
        <I.Info/> О программе
      </button>
      <div className="nav-right">
        <div className="nav-user" onClick={onLogout} title="Нажмите для выхода">
          <div className="nav-avatar">{user.username[0].toUpperCase()}</div>
          <span className="nav-username">{user.username}</span>
        </div>
      </div>
    </div>
  );
}

/* ═══════════════ TWEAKS ═══════════════ */
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "particles": true,
  "glassBlur": 80
}/*EDITMODE-END*/;

/* ═══════════════ APP ═══════════════ */
function App() {
  const [user, setUser] = useState(null);
  const [tab, setTab] = useState('play');
  const [selectedProfile, setSelectedProfile] = useState(null);
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

  // Initialize starfield inside window after mount
  useEffect(()=>{
    const canvas = document.getElementById('stars-canvas');
    if(!canvas) return;
    const ctx = canvas.getContext('2d');
    const W = 960, H = 600;
    canvas.width = W; canvas.height = H;

    const stars = [];
    const particles = [];
    for(let i=0;i<180;i++){
      stars.push({
        x:Math.random()*W, y:Math.random()*H,
        r:Math.random()*1.2+0.2,
        o:Math.random()*0.5+0.1,
        t:Math.random()*Math.PI*2,
        ts:(Math.random()-0.5)*0.012
      });
    }
    for(let i=0;i<28;i++){
      particles.push({
        x:Math.random()*W, y:Math.random()*H,
        vx:(Math.random()-0.5)*0.25,
        vy:(Math.random()-0.5)*0.15-0.05,
        r:Math.random()*2+0.8,
        color:Math.random()>0.5?'rgba(37,195,232,':'rgba(86,37,232,',
        o:Math.random()*0.35+0.1,
      });
    }

    let raf;
    function draw(){
      ctx.clearRect(0,0,W,H);
      const g1=ctx.createRadialGradient(W*0.25,H*0.3,0,W*0.25,H*0.3,280);
      g1.addColorStop(0,'rgba(37,195,232,0.07)');g1.addColorStop(1,'transparent');
      ctx.fillStyle=g1;ctx.fillRect(0,0,W,H);
      const g2=ctx.createRadialGradient(W*0.78,H*0.72,0,W*0.78,H*0.72,300);
      g2.addColorStop(0,'rgba(86,37,232,0.08)');g2.addColorStop(1,'transparent');
      ctx.fillStyle=g2;ctx.fillRect(0,0,W,H);
      stars.forEach(s=>{
        s.t+=s.ts;
        const o=s.o+Math.sin(s.t)*0.25;
        ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
        ctx.fillStyle=`rgba(210,210,255,${Math.max(0,o)})`;ctx.fill();
      });
      particles.forEach(p=>{
        p.x+=p.vx;p.y+=p.vy;
        if(p.x<0)p.x=W;if(p.x>W)p.x=0;
        if(p.y<0)p.y=H;if(p.y>H)p.y=0;
        const pg=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*3);
        pg.addColorStop(0,p.color+p.o+')');pg.addColorStop(1,p.color+'0)');
        ctx.beginPath();ctx.arc(p.x,p.y,p.r*3,0,Math.PI*2);
        ctx.fillStyle=pg;ctx.fill();
      });
      raf=requestAnimationFrame(draw);
    }
    draw();
    return ()=>cancelAnimationFrame(raf);
  },[]);

  // Show/hide stars based on tweak — handled via inline style on canvas now

  function handleTabChange(newTab) {
    setTab(newTab);
    setSelectedProfile(null);
  }

  function handleSelectProfile(p) {
    setSelectedProfile(p);
    setTab('detail');
  }

  const showNav = !!user;

  return (
    <>
      <div className="window">
        <canvas id="stars-canvas" style={{position:'absolute',inset:0,zIndex:0,pointerEvents:'none',borderRadius:18,display:t.particles?'block':'none'}}/>
        {/* Titlebar */}
        <div className="titlebar">
          <div className="traffic-lights">
            <div className="dot dot-r"/>
            <div className="dot dot-y"/>
            <div className="dot dot-g"/>
          </div>
          <div className="titlebar-title">Infinity Launcher</div>
        </div>

        {/* Auth gate */}
        {!user && <LoginScreen onLogin={setUser}/>}

        {/* Main UI */}
        {user && (
          <>
            <TopNav
              tab={tab==='detail'?'play':tab}
              setTab={handleTabChange}
              user={user}
              onLogout={()=>{ if(window.confirm('Выйти из аккаунта?')) setUser(null); }}
            />
            <div className="content">
              {(tab==='play' && !selectedProfile) && <PlayPage onSelect={handleSelectProfile}/>}
              {(tab==='detail' && selectedProfile) && (
                <DetailPage
                  profile={selectedProfile}
                  onBack={()=>{ setTab('play'); setSelectedProfile(null); }}
                />
              )}
              {tab==='info' && <InfoPage/>}
            </div>
          </>
        )}
      </div>

      <TweaksPanel>
        <TweakSection label="Фон"/>
        <TweakToggle label="Частицы и звёзды" value={t.particles} onChange={v=>setTweak('particles',v)}/>
        <TweakSection label="Стекло"/>
        <TweakSlider label="Размытие (blur)" value={t.glassBlur} min={10} max={80} step={5}
          onChange={v=>{
            setTweak('glassBlur',v);
            document.querySelector('.window').style.backdropFilter=`blur(${v}px) saturate(140%)`;
          }}/>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
