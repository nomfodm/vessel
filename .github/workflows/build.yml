name: Build

on:
  workflow_dispatch:
    inputs:
      os:
        description: 'OS to build for'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - windows
          - macos
          - linux

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - id: matrix
        shell: bash
        run: |
          case "${{ inputs.os }}" in
            windows) echo 'value={"include":[{"os":"windows-latest","platform":"windows","binary":"infinitylauncher.exe"}]}' >> $GITHUB_OUTPUT ;;
            macos)   echo 'value={"include":[{"os":"macos-latest","platform":"darwin","binary":"infinitylauncher"}]}' >> $GITHUB_OUTPUT ;;
            linux)   echo 'value={"include":[{"os":"ubuntu-latest","platform":"linux","binary":"infinitylauncher"}]}' >> $GITHUB_OUTPUT ;;
            *)       echo 'value={"include":[{"os":"windows-latest","platform":"windows","binary":"infinitylauncher.exe"},{"os":"macos-latest","platform":"darwin","binary":"infinitylauncher"},{"os":"ubuntu-latest","platform":"linux","binary":"infinitylauncher"}]}' >> $GITHUB_OUTPUT ;;
          esac

  build:
    needs: setup
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha.84

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build
        run: wails3 build VERSION=dev APP_NAME=infinitylauncher

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: InfinityLauncher-${{ matrix.platform }}-amd64
          path: bin/${{ matrix.binary }}
          if-no-files-found: error
